<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webcomic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="tela-carregamento" class="tela-carregamento">
    <div class="tela-carregamento-conteudo">
      <p class="tela-carregamento-texto" id="tela-carregamento-texto">Carregando sons…</p>
      <div class="tela-carregamento-barra-fundo">
        <div class="tela-carregamento-barra" id="tela-carregamento-barra"></div>
      </div>
      <button id="btn-comecar" class="btn-selecao tela-carregamento-botao" type="button">
        Toque para começar a leitura
      </button>
    </div>
  </div>

  <main class="leitor" id="leitor">
    <!-- as páginas são inseridas aqui pelo script.js -->
  </main>

  <button id="btn-topo" class="btn-topo" aria-label="Voltar ao início">↑</button>

  <div id="aviso-audio" class="aviso-audio">🔊 Toque na tela para ativar o som</div>

  <script src="script.js"></script>
</body>
</html>
